const MAXIMUMS=PEOPLE.map((_,i)=>MATRIX.reduce((sum,row)=>sum+row.reduce((n,[a,b])=>n+(a===i?2:b===i?1:0),0),0));
function validAnswers(answers,complete=false){return Array.isArray(answers)&&answers.length===24&&Array.from(answers).every(a=>Number.isInteger(a)&&a>=0&&a<=3||!complete&&a===null);}
function dimensionPoint(q,option){return q%2===0?3-option:option;}
function scoreQuiz(answers){
 if(!validAnswers(answers,true))throw new Error('请先完成全部24道题。');
 const raw=Array(8).fill(0),hits=Array(8).fill(0),contributions=Array.from({length:8},()=>[]),sums=Array(7).fill(0),counts=Array(7).fill(0);
 MATRIX.forEach((row,q)=>{const[a,b]=row[answers[q]];raw[a]+=2;raw[b]++;hits[a]++;for(let i=0;i<8;i++)contributions[i].push(i===a?2:i===b?1:0);sums[Q_DIMS[q]]+=dimensionPoint(q,answers[q]);counts[Q_DIMS[q]]++;});
 const ranking=PEOPLE.map((_,i)=>i).sort((a,b)=>{const cross=raw[b]*MAXIMUMS[a]-raw[a]*MAXIMUMS[b];if(cross)return cross;if(hits[b]!==hits[a])return hits[b]-hits[a];for(let q=23;q>=0;q--)if(contributions[b][q]!==contributions[a][q])return contributions[b][q]-contributions[a][q];return a-b;});
 const scores=sums.map((n,i)=>Math.round(n/(3*counts[i])*100));
 const main=ranking[0],matchPercent=Math.round(raw[main]/MAXIMUMS[main]*100);
 return {main,matchPercent,raw,scores,contributions};
}
function band(score){return score<=33?0:score<=66?1:2;}

function makeReport(answers){
 const result=scoreQuiz(answers),person=PEOPLE[result.main];
 const sorted=QUESTIONS.map((q,i)=>({q:i,dimension:Q_DIMS[i],points:result.contributions[result.main][i]})).filter(x=>x.points>0).sort((a,b)=>b.points-a.points||a.q-b.q);
 const chosen=[],used=new Set();for(const x of sorted){if(!used.has(x.dimension)&&chosen.length<3){chosen.push(x);used.add(x.dimension);}}
 for(const x of sorted)if(chosen.length<3&&!chosen.some(y=>y.q===x.q))chosen.push(x);
 const evidence=chosen.map(x=>({...x,scene:SCENES[x.q],stem:QUESTIONS[x.q].stem,answer:QUESTIONS[x.q].options[answers[x.q]],interpretation:'在这道题的情境里，'+EVIDENCE_NOTES[x.dimension][dimensionPoint(x.q,answers[x.q])]}));
 const extremes=DIMS.map((d,i)=>({index:i,score:result.scores[i],deviation:Math.abs(result.scores[i]-50)})).sort((a,b)=>b.deviation-a.deviation||a.index-b.index);
 const needs=extremes.slice(0,2).map(x=>({name:DIMS[x.index].name,text:DIMS[x.index].needs[x.score<50?0:1],score:x.score}));
 const stories=[];const add=(test,title,text)=>{if(test)stories.push({title,text});};
 add(answers[8]===3||answers[9]===0,'第一顺位确认中','你希望知道自己在关系里的位置。试着提出一次具体的陪伴需要，让“我想被重视”有一个可以回应的落点。');
 add(answers[9]===3,'开放朋友圈','你接受不同的亲密关系同时存在。偶尔向旧友确认一次“你很重要”，会让自由的来往更安心。');
 add(answers[5]<=1&&answers[17]===0,'先忍后退场','有些不舒服可能积累到最后才被看见。可以更早表达一次，把当时的感受说具体。');
 add(answers[10]===0&&answers[14]>=2,'想靠近，又先退缩','试着把靠近变成一个容易完成的小动作，例如发一句问候，让对方知道你仍愿意交流。');
 add(answers[19]===3,'直言促成长','提出建议前先问“你现在想听建议吗？”先接住感受，再讲办法，能让好意更容易被理解。');
 add(answers[21]===3,'愿意为重话负责','你愿意主动修复。具体承认哪句话说重了，再说明自己的真正需要，会比一句笼统的道歉更清楚。');
 add([4,18,22].filter(q=>answers[q]===0).length>=2,'边界需要被看见','把规则提前说清，可以减少临时安排里的拉扯。也别忘了给朋友一个你愿意靠近的时间。');
 if(!stories.length)stories.push({title:'按舒服的节奏来往',text:'你的相处方式会随情境调整。和朋友交换一件“这样做，我会更舒服”的小事，可以是一个轻松的开始。'});
 let speech=DIMS[extremes[0].index].speech[extremes[0].score<50?0:1];
 if(answers[8]===3||answers[9]===0)speech='我不要求你只有我一个朋友，但希望我们的约定能被认真对待。这周我们可以单独见一次吗？';
 else if(answers[10]===0&&answers[14]>=2)speech='我其实还在意这段关系，只是不太知道怎么重新开口。如果你也愿意，我们可以从一次简单的问候开始。';
 return {...result,person,evidence,needs,extremes,stories:stories.slice(0,2),speech};

function sceneMarkup(index,extraClass=''){
 const pose=((index%24)+24)%24;
 return '<img class="duo-scene '+extraClass+'" data-pose="'+pose+'" src="'+POSE_ASSETS[pose]+'" role="img" aria-label="黄狗与蓝猫：'+POSE_CAPTIONS[pose]+'" alt="黄狗与蓝猫：'+POSE_CAPTIONS[pose]+'" width="256" height="256" decoding="async" loading="eager">';
}
function heroMarkup(extraClass=''){
 return '<img class="duo-hero '+extraClass+'" src="'+HERO_ASSET+'" alt="黄狗和蓝猫一起握住一颗发光的小星星" width="720" height="720" decoding="async" fetchpriority="high">';
}
const imageCache=new Map();
function warmScene(index){
 for(const i of [index,index+1,index+2]){
  const src=POSE_ASSETS[((i%24)+24)%24];
  if(imageCache.has(src))continue;
  const image=new Image();imageCache.set(src,image);image.src=src;
  if(image.decode)image.decode().catch(()=>{});
 }
}

}

function renderRadar(scores){

 return '<figure class="radar-figure"><svg class="radar-chart" viewBox="0 0 420 380" role="img" aria-label="七维友情雷达图：'+label+'">'+

function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){let line='';for(const char of text){if(ctx.measureText(line+char).width>maxWidth&&line){ctx.fillText(line,x,y);line=char;y+=lineHeight;}else line+=char;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}
function drawCardRadar(ctx,scores){
 const at=(i,r)=>{const a=-Math.PI/2+i*Math.PI*2/7;return [450+Math.cos(a)*r,815+Math.sin(a)*r];};
 const polygon=points=>{ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();};
 [33.5,67,100.5,134].forEach(r=>{polygon(scores.map((_,i)=>at(i,r)));ctx.strokeStyle='#d8ceb0';ctx.lineWidth=1;ctx.stroke();});
 scores.forEach((_,i)=>{const [x,y]=at(i,134);ctx.beginPath();ctx.moveTo(450,815);ctx.lineTo(x,y);ctx.strokeStyle='#ddd2b4';ctx.stroke();});
 const points=scores.map((s,i)=>at(i,s/100*134));polygon(points);ctx.fillStyle='#80924f50';ctx.fill();ctx.strokeStyle='#64763e';ctx.lineWidth=2.5;ctx.stroke();
 points.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#64763e';ctx.fill();});
 ctx.textAlign='center';scores.forEach((score,i)=>{const [x,y]=at(i,182);ctx.fillStyle='#3c4829';ctx.font='18px "Microsoft YaHei", sans-serif';ctx.fillText(DIMS[i].name,x,y);ctx.font='21px Georgia, serif';ctx.fillText(String(score),x,y+23);});ctx.textAlign='left';
}
